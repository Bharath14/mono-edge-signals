services:
  db:
    image: postgres:16
    container_name: mill-signals-db
    environment:
      POSTGRES_USER: mill
      POSTGRES_PASSWORD: mill
      POSTGRES_DB: millsignals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mill -d millsignals"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
